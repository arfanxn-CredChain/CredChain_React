services:
  react:
    env_file:
      - .env.docker
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-arfan2173@gmail.com}
    image: arfanxn/credchain-react:latest
    container_name: react
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    networks:
      - backend

networks:
  backend:
    external: true
